[workspace]
resolver = "3"
members = ["ili9341-registers", "ili9341-ng", "ili9341-sim"]
exclude = ["sim/wokwi-chip", "examples"]

[workspace.package]
version = "0.2.0"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "EUPL-1.2 OR MIT OR Apache-2.0"
homepage = "https://github.com/sunsided/ili9341"
repository = "https://github.com/sunsided/ili9341"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
bitfield-struct = "0.13.0"
defmt = "1.0.1"
embedded-graphics = "0.8.2"
embedded-graphics-core = "0.4.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-futures = "0.1.2"
fake-bus = "0.1.0"
ili9341-registers = { version = "0.2.0", path = "ili9341-registers" }
# The driver's package name; its library is imported as `ili9341_ng`.
ili9341-ng = { version = "0.2.0", path = "ili9341-ng" }
ili9341-sim = { path = "ili9341-sim" }

[workspace.lints.clippy]
# Modules live in `name.rs` plus `name/`, never in `name/mod.rs`.
mod_module_files = "deny"
