[package]
name = "ili9341-ng"
description = "A platform-agnostic embedded-hal driver for the Ilitek ILI9341 TFT LCD controller (SPI and parallel)"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["embedded-hal-driver", "ili9341", "display", "lcd", "tft"]
readme = "README.md"
# The tests need the unpublished ili9341-sim crate.
exclude = ["tests/"]
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
async = ["dep:embedded-hal-async"]
defmt = ["dep:defmt", "ili9341-registers/defmt"]
embedded-graphics = ["dep:embedded-graphics-core"]

[dependencies]
defmt = { workspace = true, optional = true }
embedded-graphics-core = { workspace = true, optional = true }
embedded-hal.workspace = true
embedded-hal-async = { workspace = true, optional = true }
ili9341-registers.workspace = true

[dev-dependencies]
embassy-futures.workspace = true
embedded-graphics.workspace = true
embedded-hal-async.workspace = true
fake-bus.workspace = true
ili9341-sim.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/ili9341/releases/tag/v{{version}}", exactly = 1 },
]
