[package]
name = "ili9341-registers"
description = "A typed map of the Ilitek ILI9341 TFT LCD controller commands"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["embedded-hal", "ili9341", "display", "lcd", "tft"]
readme = "README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
defmt = ["dep:defmt"]

[dependencies]
bitfield-struct.workspace = true
defmt = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.release]
tag = false
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/ili9341/releases/tag/v{{version}}", exactly = 1 },
]
