# Tasks for the ili9341 workspace: `task` lists them.
# https://taskfile.dev
version: '3'

vars:
  CHIP_DIR: sim/wokwi-chip
  FIRMWARE_DIR: examples/esp32c3

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  build:
    desc: Build the workspace with all features
    preconditions: &cargo
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - cargo build --workspace --all-features {{.CLI_ARGS}}

  test:
    desc: Run the tests with default, all and no default features (as CI does)
    preconditions: *cargo
    cmds:
      - cargo test --workspace {{.CLI_ARGS}}
      - cargo test --workspace --all-features {{.CLI_ARGS}}
      - cargo test --workspace --no-default-features {{.CLI_ARGS}}

  fmt:
    desc: Format the workspace, the Wokwi chip and the firmware
    aliases: [format]
    preconditions: *cargo
    cmds:
      - cargo fmt --all
      - cd {{.CHIP_DIR}} && cargo fmt
      - cd {{.FIRMWARE_DIR}} && cargo fmt

  lint:
    desc: Run clippy on the workspace
    preconditions: *cargo
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  lint:fix:
    desc: Apply clippy fixes, then format
    aliases: [fix]
    preconditions: *cargo
    cmds:
      - cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged
      - task: fmt

  lint:workflows:
    desc: Lint the GitHub workflows with actionlint and zizmor
    preconditions:
      - sh: command -v actionlint
        msg: "actionlint not found — see https://github.com/rhysd/actionlint"
      - sh: command -v zizmor
        msg: "zizmor not found — pipx install zizmor"
    cmds:
      - actionlint
      - zizmor --offline --persona=auditor .github

  check:
    desc: Check formatting, clippy and docs without changing files
    preconditions: *cargo
    cmds:
      - cargo fmt --all --check
      - task: lint
      - task: docs

  ci:
    desc: Run the main CI checks locally
    cmds:
      - task: check
      - task: test

  docs:
    desc: Build the documentation
    preconditions: *cargo
    cmds:
      - cargo doc --workspace --all-features --no-deps

  docs:open:
    desc: Build the documentation and open it
    preconditions: *cargo
    cmds:
      - cargo doc --workspace --all-features --no-deps --open

  coverage:
    desc: Print a line coverage summary
    preconditions:
      - sh: command -v cargo-llvm-cov
        msg: "cargo-llvm-cov not found — cargo install cargo-llvm-cov"
    cmds:
      - cargo llvm-cov --workspace --all-features --summary-only

  chip:
    desc: Build the Wokwi chip (ili9341.chip.wasm)
    preconditions:
      - sh: rustup target list --installed | grep -q wasm32-unknown-unknown
        msg: "wasm target missing — rustup target add wasm32-unknown-unknown"
    sources:
      - '{{.CHIP_DIR}}/src/**/*.rs'
      - '{{.CHIP_DIR}}/Cargo.toml'
      - ili9341-sim/src/**/*.rs
      - ili9341-registers/src/**/*.rs
    generates:
      - '{{.CHIP_DIR}}/ili9341.chip.wasm'
    cmds:
      - '{{.CHIP_DIR}}/build.sh'

  firmware:
    desc: Build the ESP32-C3 example firmware (all binaries)
    preconditions:
      - sh: rustup target list --installed | grep -q riscv32imc-unknown-none-elf
        msg: "RISC-V target missing — rustup target add riscv32imc-unknown-none-elf"
    cmds:
      - cd {{.FIRMWARE_DIR}} && cargo build --release

  sim:
    desc: Run the drawing scenario on the built-in ILI9341 and the chip, the SPI and parallel read-back scenarios on the chip, and the async example
    deps: [chip, firmware]
    preconditions:
      - sh: command -v wokwi-cli
        msg: "wokwi-cli not found — see https://docs.wokwi.com/wokwi-ci/cli-installation"
      - sh: test -n "$WOKWI_CLI_TOKEN"
        msg: "WOKWI_CLI_TOKEN not set — create one at https://wokwi.com/dashboard/ci"
    cmds:
      - cd {{.FIRMWARE_DIR}} && wokwi-cli . --scenario scenarios/draw.yaml --timeout 10000 --screenshot-part lcd1 --screenshot-time 1500 --screenshot-file screenshot.png
      - cd {{.FIRMWARE_DIR}} && wokwi-cli . --diagram-file diagram-chip.json --scenario scenarios/draw.yaml --timeout 10000 --screenshot-part lcd1 --screenshot-time 1500 --screenshot-file screenshot-chip.png
      - cd {{.FIRMWARE_DIR}} && wokwi-cli . --diagram-file diagram-chip.json --elf target/riscv32imc-unknown-none-elf/release/readback --scenario scenarios/readback.yaml --timeout 10000
      - cd {{.FIRMWARE_DIR}} && wokwi-cli . --diagram-file diagram-parallel.json --elf target/riscv32imc-unknown-none-elf/release/parallel --scenario scenarios/parallel.yaml --timeout 10000
      - cd {{.FIRMWARE_DIR}} && wokwi-cli . --elf target/riscv32imc-unknown-none-elf/release/async --scenario scenarios/draw.yaml --timeout 10000 --screenshot-part lcd1 --screenshot-time 1500 --screenshot-file screenshot-async.png

  msrv:
    desc: Run the tests on the minimum supported Rust version
    preconditions: *cargo
    vars:
      MSRV:
        sh: cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ili9341-ng") | .rust_version'
    cmds:
      - cargo +{{.MSRV}} test --workspace --all-features {{.CLI_ARGS}}

  no-std:
    desc: Build the published crates for a bare-metal target (thumbv7em-none-eabihf)
    preconditions:
      - sh: rustup target list --installed | grep -q thumbv7em-none-eabihf
        msg: "target missing — rustup target add thumbv7em-none-eabihf"
    cmds:
      - cargo build -p ili9341-registers -p ili9341-ng --target thumbv7em-none-eabihf --all-features
      - cargo build -p ili9341-registers -p ili9341-ng --target thumbv7em-none-eabihf --no-default-features

  semver:
    desc: Check the published crates for breaking changes against crates.io (release CI runs this too)
    preconditions:
      - sh: command -v cargo-semver-checks
        msg: "cargo-semver-checks not found — cargo install cargo-semver-checks --locked"
    cmds:
      - cargo semver-checks -p ili9341-registers -p ili9341-ng

  release:dry:
    desc: Preview a release without changing anything (LEVEL=patch|minor|major)
    vars:
      LEVEL: '{{ .LEVEL | default "patch" }}'
    requires:
      vars:
        - name: LEVEL
          enum: [patch, minor, major]
    preconditions:
      - sh: command -v cargo-release
        msg: "cargo-release not found — cargo install cargo-release"
    cmds:
      - cargo release {{.LEVEL}} --workspace

  clean:
    desc: Remove build output of the workspace, the chip and the firmware
    preconditions: *cargo
    cmds:
      - cargo clean
      - cd {{.CHIP_DIR}} && cargo clean && rm -f ili9341.chip.wasm
      - cd {{.FIRMWARE_DIR}} && cargo clean
